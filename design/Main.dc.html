<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Joseki Trainer</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;600;700;800&family=Patrick+Hand&display=swap">
<style>

button{font-family:inherit;cursor:pointer}
h1{font-family:'Patrick Hand',Nunito,sans-serif !important;font-weight:400 !important;letter-spacing:0 !important}
button.mnu{border:0;box-shadow:none;border-radius:0;height:auto;width:fit-content;padding:0 3px 4px;margin:0;background:url(data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCAxMDAgNiIgcHJlc2VydmVBc3BlY3RSYXRpbz0ibm9uZSI+PHBhdGggZD0iTTEgMy42QzIyIDIuNCA1OCAzLjQgOTkgMS44IiBmaWxsPSJub25lIiBzdHJva2U9IiM5YTllYjQiIHN0cm9rZS13aWR0aD0iMS41IiBzdHJva2UtbGluZWNhcD0icm91bmQiLz48L3N2Zz4=) left bottom/100% 6px no-repeat;color:#6b6f8c;font-family:'Patrick Hand',Nunito,sans-serif;font-size:21px;font-weight:400;line-height:1.1}
button.pri:not(.a):not(.b):not(.c):not(.d){background:url(data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCAxMDAgMTIiIHByZXNlcnZlQXNwZWN0UmF0aW89Im5vbmUiPjxwYXRoIGQ9Ik0xIDYuNkMyNSA1LjYgNjIgNS40IDk5IDEuNCIgZmlsbD0ibm9uZSIgc3Ryb2tlPSIjNGI0ZjZlIiBzdHJva2Utd2lkdGg9IjIuMyIgc3Ryb2tlLWxpbmVjYXA9InJvdW5kIiBvcGFjaXR5PSIuOTIiLz48cGF0aCBkPSJNNSA3LjRDMzQgNi42IDY0IDYgOTAgMy4yIiBmaWxsPSJub25lIiBzdHJva2U9IiM0YjRmNmUiIHN0cm9rZS13aWR0aD0iLjkiIHN0cm9rZS1saW5lY2FwPSJyb3VuZCIgb3BhY2l0eT0iLjUiLz48cGF0aCBkPSJNNyAxMC42QzMwIDkuOCA2NiAxMC40IDk5LjUgNS40IiBmaWxsPSJub25lIiBzdHJva2U9IiM0YjRmNmUiIHN0cm9rZS13aWR0aD0iMS44IiBzdHJva2UtbGluZWNhcD0icm91bmQiIG9wYWNpdHk9Ii44NSIvPjxwYXRoIGQ9Ik0xMiAxMS40QzQyIDEwLjYgNzAgMTAuNCA5MSA3LjIiIGZpbGw9Im5vbmUiIHN0cm9rZT0iIzRiNGY2ZSIgc3Ryb2tlLXdpZHRoPSIuOCIgc3Ryb2tlLWxpbmVjYXA9InJvdW5kIiBvcGFjaXR5PSIuNDUiLz48L3N2Zz4=) left bottom/100% 12px no-repeat !important;color:#2d3042 !important;box-shadow:none !important;border:0 !important;border-radius:0 !important;height:auto !important;width:fit-content !important;align-self:center !important;margin-left:auto !important;margin-right:auto !important;padding:0 10px 4.5px !important;font-family:'Patrick Hand',Nunito,sans-serif !important;font-size:26px !important;font-weight:400 !important;line-height:1.1 !important}
button.pri.ttl:not(.a):not(.b):not(.c):not(.d){font-size:44px !important;padding:0 12px 6px !important;background-size:100% 14px !important}
button:not([aria-label^="Point"]):not([aria-label^="Option"]):not(.stp):not(.mnu){border:2px solid #4b4f6e !important;border-width:2px 2.8px 2.3px 2.5px !important;border-radius:24px 30px 26px 28px/28px 24px 30px 25px !important;box-shadow:2px 2.5px 0 rgba(75,79,110,.28) !important}
@keyframes drop{0%{transform:translateY(-22px) scale(1.25);opacity:0}65%{transform:translateY(2px) scale(.94);opacity:1}100%{transform:none;opacity:1}}
@keyframes hop{0%,100%{transform:translateY(0)}40%{transform:translateY(-8px)}}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-5px)}40%{transform:translateX(5px)}60%{transform:translateX(-4px)}80%{transform:translateX(3px)}}
@keyframes blink{0%,90%,100%{transform:scaleY(1)}95%{transform:scaleY(.1)}}
@keyframes pop{0%{transform:scale(.3)}60%{transform:scale(1.4)}100%{transform:none}}
@keyframes swing{0%,100%{transform:rotate(0)}25%{transform:rotate(5deg)}75%{transform:rotate(-5deg)}}
@keyframes l40{from{height:0}to{height:40px}}
@keyframes l50{from{height:0}to{height:50px}}
@keyframes l60{from{height:0}to{height:60px}}
@keyframes l100{from{height:0}to{height:100px}}
@keyframes l110{from{height:0}to{height:110px}}
@keyframes fade{to{opacity:0}}
@keyframes fade2{to{opacity:0}}
@keyframes strike{from{opacity:0;transform:scale(.85)}to{opacity:1;transform:none}}
@keyframes rp{from{height:0}to{height:370px}}
@keyframes sway{0%,100%{transform:rotate(0)}50%{transform:rotate(3deg)}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
button.pk:not(.a):not(.b):not(.c):not(.d):not(.e){border:0 !important;box-shadow:none !important;border-radius:0 !important;text-align:left}
button.pri.rt:not(.a):not(.b):not(.c):not(.d){margin-right:0 !important;margin-left:auto !important;font-size:24px !important}
</style>
</helmet>
<div style="width:390px;height:844px;box-sizing:border-box;background:url(data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSIyMDAiIGhlaWdodD0iMjAwIj48ZmlsdGVyIGlkPSJuIj48ZmVUdXJidWxlbmNlIHR5cGU9ImZyYWN0YWxOb2lzZSIgYmFzZUZyZXF1ZW5jeT0iLjkiIG51bU9jdGF2ZXM9IjIiIHNlZWQ9IjQiLz48ZmVDb2xvck1hdHJpeCB2YWx1ZXM9IjAgMCAwIDAgLjQ1ICAwIDAgMCAwIC40ICAwIDAgMCAwIC4zICAwIDAgMCAuMDkgMCIvPjwvZmlsdGVyPjxyZWN0IHdpZHRoPSIyMDAiIGhlaWdodD0iMjAwIiBmaWx0ZXI9InVybCgjbikiLz48L3N2Zz4=) #f8f4e9;overflow:hidden;position:relative">
<div style="{{hangStyle}}"><div style="{{threadStyle}}"></div><div style="{{bugStyle}}"></div></div>

<sc-if value="{{ isMenu }}" hint-placeholder-val="{{ false }}">
<div style="height:100%;box-sizing:border-box;padding:64px 28px 32px;display:flex;flex-direction:column;gap:6px;overflow:auto">
<h1 style="margin:0 0 18px;padding-right:70px;font-size:32px;line-height:1.15;color:#2d3042">{{tagline}}</h1>
<sc-for list="{{josekiList}}" as="j" hint-placeholder-count="2">
<button class="pk" onClick="{{j.act}}" aria-label="{{j.aria}}" style="{{j.rowStyle}}">
<div style="width:58px;height:58px;flex:none;background:{{j.thumb}} center/58px 58px no-repeat"></div>
<div style="flex:1;min-width:0"><div style="font-family:'Patrick Hand',Nunito,sans-serif;font-size:26px;line-height:1.1;color:#2d3042">{{j.name}}</div><div style="margin-top:4px;font-size:13px;font-weight:600;color:#7a7e90">{{j.sub}}</div></div>
<div style="{{j.todoStyle}}">to do</div>
<div style="{{j.markStyle}}"></div>
</button>
<sc-if value="{{ vA }}" hint-placeholder-val="{{ true }}"><div style="{{ruleStyle}}"></div></sc-if>
</sc-for>
</div>
</sc-if>

<sc-if value="{{ isPicker }}" hint-placeholder-val="{{ false }}">
<div style="height:100%;box-sizing:border-box;padding:56px 28px 32px;display:flex;flex-direction:column;gap:8px">
<div style="display:flex;justify-content:flex-start;align-items:center;height:28px">
<button class="mnu" onClick="{{toMenuFromPicker}}">Menu</button>
</div>
<h1 style="margin:14px 0 20px;font-size:34px;line-height:1.1;color:#2d3042">{{josekiTitle}}</h1>
<sc-for list="{{pickerList}}" as="k" hint-placeholder-count="4">
<button class="{{pkClass}}" onClick="{{k.act}}" style="{{k.rowStyle}}"><span style="{{k.dot}}"></span>{{k.label}}</button>
<sc-if value="{{ vA }}" hint-placeholder-val="{{ true }}"><div style="{{ruleStyle}}"></div></sc-if>
</sc-for>
</div>
</sc-if>

<sc-if value="{{ isStart }}" hint-placeholder-val="{{ true }}">
<div style="height:100%;box-sizing:border-box;padding:56px 28px 40px;display:flex;flex-direction:column;gap:14px">
<div style="display:flex;align-items:center;height:28px"><button class="mnu" onClick="{{toMenu}}">Menu</button></div>
<h1 style="margin:14px 0 0;font-size:38px;line-height:1.08;color:#2d3042">{{josekiTitle}}</h1>
<div style="font-size:16px;line-height:1.5;color:#5a5f74;max-width:320px">{{josekiWhy}}</div>
<div style="flex:1;min-height:0;display:flex;align-items:center;justify-content:center"><div style="{{thinkSpider}}"></div></div>
<button class="pri" onClick="{{begin}}">Start</button>
</div>
</sc-if>

<sc-if value="{{ isIntro }}" hint-placeholder-val="{{ false }}">
<div style="height:100%;box-sizing:border-box;padding:56px 25px 40px;display:flex;flex-direction:column">
<sc-if value="{{ hdCur }}" hint-placeholder-val="{{ true }}">
<div style="display:flex;justify-content:space-between;align-items:center;height:28px;flex:none">
<button class="mnu" onClick="{{toMenu}}" aria-label="Back to menu">Menu</button>
<div style="font-family:'Patrick Hand',Nunito,sans-serif;font-size:22px;flex:1;text-align:center;color:#2d3042">{{lessonTitle}}</div>
<div style="min-width:48px"></div>
</div>
</sc-if>
<sc-if value="{{ hdX }}" hint-placeholder-val="{{ false }}">
<div style="display:flex;flex-direction:column;align-items:flex-start;gap:8px;flex:none">
<button class="mnu" onClick="{{toMenu}}" aria-label="Back to menu">Menu</button>
<div style="font-family:'Patrick Hand',Nunito,sans-serif;font-size:31px;line-height:1.1;color:#2d3042">{{headTitle}}</div>
</div>
</sc-if>
<sc-if value="{{ hdY }}" hint-placeholder-val="{{ false }}">
<div style="display:flex;align-items:center;gap:12px;height:48px;flex:none">
<div style="{{headThumb}}"></div>
<div style="flex:1;min-width:0;font-family:'Patrick Hand',Nunito,sans-serif;font-size:25px;line-height:1.1;color:#2d3042">{{headTitle}}</div>
<button class="mnu" onClick="{{toMenu}}" aria-label="Back to menu">Menu</button>
</div>
</sc-if>
<sc-if value="{{ isThread }}" hint-placeholder-val="{{ false }}">
<div style="{{threadBox}}">
<div style="{{threadInk}}"></div>
<sc-for list="{{threadKnots}}" as="tk" hint-placeholder-count="3"><div style="{{tk.style}}"></div></sc-for>
<sc-for list="{{threadTangles}}" as="tg" hint-placeholder-count="3"><div style="{{tg.style}}"></div></sc-for>
<sc-for list="{{threadLabels}}" as="tl" hint-placeholder-count="4"><button class="stp" onClick="{{tl.act}}" style="{{tl.style}}">{{tl.t}}</button></sc-for>
<div style="{{threadWalker}}"></div>
</div>
</sc-if>
<div style="{{stageRowStyle}}">
<sc-for list="{{stages}}" as="s" hint-placeholder-count="4">
<button class="stp" onClick="{{s.act}}" style="{{s.btn}}">{{s.label}}</button>
<sc-if value="{{ s.hasLink }}" hint-placeholder-val="{{ false }}"><div style="{{s.link}}"></div></sc-if>
</sc-for>
</div>
<div style="flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:14px;padding-bottom:40px">
<div style="{{heroSpider}}"></div>
<button class="pri ttl" onClick="{{startStage}}">{{introTitle}}</button>
<div style="font-size:16px;line-height:1.5;color:#5a5f74;max-width:290px">{{introText}}</div>
</div>
</div>
</sc-if>

<sc-if value="{{ isLesson }}" hint-placeholder-val="{{ false }}">
<div style="height:100%;box-sizing:border-box;padding:56px 25px 28px;display:flex;flex-direction:column">
<sc-if value="{{ hdCur }}" hint-placeholder-val="{{ true }}">
<div style="display:flex;justify-content:space-between;align-items:center;height:28px;flex:none">
<button class="mnu" onClick="{{toMenu}}" aria-label="Back to menu">Menu</button>
<div style="font-family:'Patrick Hand',Nunito,sans-serif;font-size:22px;flex:1;text-align:center;color:#2d3042">{{lessonTitle}}</div>
<div style="min-width:48px"></div>
</div>
</sc-if>
<sc-if value="{{ hdX }}" hint-placeholder-val="{{ false }}">
<div style="display:flex;flex-direction:column;align-items:flex-start;gap:8px;flex:none">
<button class="mnu" onClick="{{toMenu}}" aria-label="Back to menu">Menu</button>
<div style="font-family:'Patrick Hand',Nunito,sans-serif;font-size:31px;line-height:1.1;color:#2d3042">{{headTitle}}</div>
</div>
</sc-if>
<sc-if value="{{ hdY }}" hint-placeholder-val="{{ false }}">
<div style="display:flex;align-items:center;gap:12px;height:48px;flex:none">
<div style="{{headThumb}}"></div>
<div style="flex:1;min-width:0;font-family:'Patrick Hand',Nunito,sans-serif;font-size:25px;line-height:1.1;color:#2d3042">{{headTitle}}</div>
<button class="mnu" onClick="{{toMenu}}" aria-label="Back to menu">Menu</button>
</div>
</sc-if>
<sc-if value="{{ isThread }}" hint-placeholder-val="{{ false }}">
<div style="{{threadBox}}">
<div style="{{threadInk}}"></div>
<sc-for list="{{threadKnots}}" as="tk" hint-placeholder-count="3"><div style="{{tk.style}}"></div></sc-for>
<sc-for list="{{threadTangles}}" as="tg" hint-placeholder-count="3"><div style="{{tg.style}}"></div></sc-for>
<sc-for list="{{threadLabels}}" as="tl" hint-placeholder-count="4"><button class="stp" onClick="{{tl.act}}" style="{{tl.style}}">{{tl.t}}</button></sc-for>
<div style="{{threadWalker}}"></div>
</div>
</sc-if>
<div style="{{stageRowStyle}}">
<sc-for list="{{stages}}" as="s" hint-placeholder-count="4">
<button class="stp" onClick="{{s.act}}" style="{{s.btn}}">{{s.label}}</button>
<sc-if value="{{ s.hasLink }}" hint-placeholder-val="{{ false }}"><div style="{{s.link}}"></div></sc-if>
</sc-for>
</div>
<div style="{{barWrap}}"><div style="{{barBox}}"><div style="{{barFill}}"></div><div style="{{markerStyle}}"></div><div style="{{walkerStyle}}"></div></div></div>
<div style="flex:1;min-height:0;display:flex;flex-direction:column;justify-content:center">
<div style="display:flex;align-items:flex-end;height:64px;flex:none;margin-bottom:14px"><div style="{{promptStyle}}">{{shownPrompt}}</div></div>
<div style="flex:none;display:flex;justify-content:center">
<div style="{{boardStyle}}">
<div style="{{gridStyle}}"></div>
<sc-for list="{{edges}}" as="e" hint-placeholder-count="2">
<div style="{{e.style}}"></div>
</sc-for>
<sc-for list="{{stones}}" as="st" hint-placeholder-count="2">
<div style="{{st.style}}"><div style="{{st.eyes}}"></div><div style="{{st.mouth}}"></div>{{st.label}}<div style="{{st.numStyle}}">{{st.num}}</div></div>
</sc-for>
<sc-for list="{{cells}}" as="cell" hint-placeholder-count="0">
<button aria-label="{{cell.label}}" onClick="{{cell.tap}}" style="{{cell.style}}"></button>
</sc-for>
</div>
</div>
<sc-if value="{{ showOptions }}" hint-placeholder-val="{{ false }}">
<div style="display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;flex:none">
<sc-for list="{{options}}" as="o" hint-placeholder-count="3">
<button onClick="{{o.pick}}" style="{{o.style}}">{{o.l}}</button>
</sc-for>
</div>
</sc-if>
<div style="height:84px;flex:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px">
<sc-if value="{{ showNext }}" hint-placeholder-val="{{ false }}">
<button class="pri" onClick="{{nextAction}}">{{nextLabel}}</button>
</sc-if>
<sc-if value="{{ showMore }}" hint-placeholder-val="{{ false }}">
<button class="mnu" onClick="{{moreAction}}">One more corner</button>
</sc-if>
</div>
</div>
</div>
</sc-if>

<sc-if value="{{ isResult }}" hint-placeholder-val="{{ false }}">
<div style="{{resultWrap}}">
<div style="{{rappelBox}}"><div style="{{rappelThread}}"></div><div style="{{rappelSpider}}"></div></div>
<div style="{{resultSpider}}"></div>
<sc-if value="{{ isThread }}" hint-placeholder-val="{{ false }}"><div style="height:420px;flex:none"></div></sc-if>
<h1 style="margin:0;font-size:44px;line-height:1.1;color:#2d3042">{{resultTitle}}</h1>
<sc-if value="{{ isThread }}" hint-placeholder-val="{{ false }}"><div style="display:flex;gap:18px"><sc-for list="{{resultWebs}}" as="rw" hint-placeholder-count="3"><div style="{{rw.style}}"></div></sc-for></div></sc-if>
<div style="width:100%;max-width:300px"><div style="{{barBox}}"><div style="{{barFill}}"></div><div style="{{markerStyle}}"></div><div style="{{walkerStyle}}"></div></div></div>
<div style="{{resultTextStyle}}">{{resultText}}</div>
<button class="pri" onClick="{{resultAction}}" style="margin-top:20px">{{resultButton}}</button>
</div>
</sc-if>

<sc-if value="{{ isDemo }}" hint-placeholder-val="{{ false }}">
<button class="stp" onClick="{{demoNext}}" style="position:absolute;right:12px;bottom:12px;z-index:60;border:1.5px dashed #9a9eb8;border-radius:16px;padding:6px 12px;background:rgba(255,253,247,.85);font:700 13px Nunito,sans-serif;color:#6b6f8c">Next step ›</button>
</sc-if>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"startAt":{"editor":null},"variant":{"editor":null},"row":{"editor":null},"demo":{"editor":null},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { wk: 0, screen: 'menu', review: false, watchOnly: false, elim: [], flash: null, tries: 0, rd: null, sadLast: false, dir: 0, dirSet: false, jid: 'j33', learned: {}, stage: 0, intro: true, n: 2, t: 0, round: 0, w: 0, q: 0, answered: null, pts: 0, msg: '', kind: '', wrong: null };
    // Design canvas only: the boards pass start-at to open the app on a fixed screen.
    if (props && props.startAt) Object.assign(this.state, this.preset(props.startAt));
  }
  data() {
    const B = (c, r) => ({ c: c, r: r, w: false }), W = (c, r) => ({ c: c, r: r, w: true });
    return {
      j33: {
        d: 2, title: 'Star point: 3-3 invasion', short: '3-3 invasion', sub: 'Invade, block, crawl, extend', tint: '#ffe3dc',
        seq: [B(4, 4), W(3, 3), B(3, 4), W(4, 3), B(5, 4), W(6, 2)],
        why: 'White takes the corner and lives small. Black gets a strong wall.',
        tc: 'Invade the {c} corner.',
        tryP: { 2: 'Block on the side you want to build.', 4: 'Extend.' },
        tb: { 2: 'White invades at 3-3. Block on the side you want to build.', 4: 'White crawls along the edge. Extend.' },
        tw: { 1: 'Invade at 3-3 in the {c} corner.', 3: 'Crawl along the edge.', 5: 'Slide with a knight\u2019s move.' },
        ex: ['Black plays the star point.', 'White invades at 3-3 and has just enough room to live.', 'Black blocks on the side where they want to build.', 'White crawls along the edge to make room for eyes.', 'Black extends and keeps a strong wall.', 'White slides with a knight\u2019s move to settle the corner.'],
        qs: [
          { shown: 2, opts: [{ c: 5, r: 3 }, { c: 3, r: 4 }, { c: 2, r: 4 }], ok: 1, p: 'White invaded at 3-3. Black\u2019s block?' },
          { shown: 3, opts: [{ c: 5, r: 3 }, { c: 2, r: 5 }, { c: 4, r: 3 }], ok: 2, p: 'Crawl along the edge.' },
          { shown: 4, opts: [{ c: 6, r: 5 }, { c: 5, r: 4 }, { c: 3, r: 6 }], ok: 1, p: 'Black\u2019s extension?' }
        ]
      },
      j44: {
        d: 1, title: 'Star point: low approach', short: 'Low approach', sub: 'Approach, extension, slide', tint: '#e9ebf1',
        seq: [B(4, 4), W(6, 3), B(3, 6), W(4, 2), B(3, 3), W(9, 3)],
        why: 'A classic: White approaches, Black builds a base and extends.',
        tc: 'Approach the {c} corner.',
        tryP: { 2: 'Extend low to the other side.', 4: 'Take the 3-3 point.' },
        tb: { 2: 'White approaches low. Extend low to the other side.', 4: 'White slides to the 2nd line. Take the 3-3 point.' },
        tw: { 1: 'Approach low in the {c} corner.', 3: 'Slide to the 2nd line.', 5: 'Extend along the edge.' },
        ex: ['Black plays the star point.', 'White approaches low, a knight\u2019s move away on the 3rd line.', 'Black extends low to the other side, also a knight\u2019s move.', 'White slides onto the 2nd line.', 'Black takes the 3-3 point.', 'White extends along the top edge.'],
        qs: [
          { shown: 2, opts: [{ c: 5, r: 4 }, { c: 3, r: 6 }, { c: 7, r: 3 }], ok: 1, p: 'Black\u2019s low extension?' },
          { shown: 3, opts: [{ c: 6, r: 5 }, { c: 3, r: 2 }, { c: 4, r: 2 }], ok: 2, p: 'Slide to the 2nd line.' },
          { shown: 4, opts: [{ c: 3, r: 3 }, { c: 5, r: 3 }, { c: 4, r: 6 }], ok: 0, p: 'Black\u2019s 3-3 point?' }
        ]
      },
      j34: {
        d: 0, title: '3-4 point: small knight approach', short: 'Small knight approach', sub: 'Kick, stand, extend', tint: '#dff3e7',
        seq: [B(3, 4), W(5, 3), B(4, 3), W(5, 4), B(3, 6), W(9, 3)],
        why: 'Black kicks, so White settles on top and Black keeps sente.',
        fp: 'Play the 3-4 point in the {c} corner.',
        tc: 'Approach the 3-4 point in the {c} corner.',
        tryP: { 2: 'Kick.', 4: 'Extend.' },
        tb: { 2: 'White approaches with a small knight\u2019s move. Kick.', 4: 'White stands. Extend.' },
        tw: { 1: 'Approach with a small knight\u2019s move in the {c} corner.', 3: 'Stand.', 5: 'Extend three spaces.' },
        ex: ['Black plays the 3-4 point.', 'White approaches with a small knight\u2019s move.', 'Black kicks.', 'White stands.', 'Black extends and keeps sente.', 'White extends three spaces along the edge.'],
        qs: [
          { shown: 2, opts: [{ c: 5, r: 2 }, { c: 4, r: 3 }, { c: 6, r: 4 }], ok: 1, p: 'Black\u2019s kick?' },
          { shown: 3, opts: [{ c: 4, r: 2 }, { c: 3, r: 3 }, { c: 5, r: 4 }], ok: 2, p: 'Stand.' },
          { shown: 4, opts: [{ c: 3, r: 6 }, { c: 6, r: 5 }, { c: 5, r: 5 }], ok: 0, p: 'Black\u2019s extension?' }
        ]
      }
