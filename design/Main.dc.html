<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Joseki Trainer</title>

</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;600;700;800&family=Patrick+Hand&display=swap">
<style>

<div style="width:390px;height:844px;box-sizing:border-box;background:url(data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSIyMDAiIGhlaWdodD0iMjAwIj48ZmlsdGVyIGlkPSJuIj48ZmVUdXJidWxlbmNlIHR5cGU9ImZyYWN0YWxOb2lzZSIgYmFzZUZyZXF1ZW5jeT0iLjkiIG51bU9jdGF2ZXM9IjIiIHNlZWQ9IjQiLz48ZmVDb2xvck1hdHJpeCB2YWx1ZXM9IjAgMCAwIDAgLjQ1ICAwIDAgMCAwIC40ICAwIDAgMCAwIC4zICAwIDAgMCAuMDkgMCIvPjwvZmlsdGVyPjxyZWN0IHdpZHRoPSIyMDAiIGhlaWdodD0iMjAwIiBmaWx0ZXI9InVybCgjbikiLz48L3N2Zz4=) #f8f4e9;overflow:hidden;position:relative">
<div style="{{hangStyle}}"><div style="{{threadStyle}}"></div><div style="{{bugStyle}}"></div></div>

<sc-if value="{{ isMenu }}" hint-placeholder-val="{{ false }}">
<div style="height:100%;box-sizing:border-box;padding:56px 24px 24px;display:flex;flex-direction:column;gap:16px;overflow:auto">
<h1 style="margin:0;padding-right:64px;font-size:26px;line-height:1.2;font-weight:800;letter-spacing:-0.5px">{{tagline}}</h1>
<sc-for list="{{josekiList}}" as="j" hint-placeholder-count="4">
<div style="{{j.card}}">
<div style="display:flex;align-items:center;gap:12px">
<div style="width:50px;height:50px;flex:none;background:{{j.thumb}} center/50px 50px no-repeat"></div>
<div style="flex:1;min-width:0"><div style="font-size:16px;font-weight:800">{{j.name}}</div><div style="font-size:13px;font-weight:600;color:#7a7e90">{{j.sub}}</div></div>
<div style="{{j.chipStyle}}">{{j.chip}}</div>
</div>
<div style="display:flex;gap:8px">
<button onClick="{{j.act}}" style="flex:1;{{j.btnStyle}}">{{j.btn}}</button>
<sc-if value="{{ j.hasWatch }}" hint-placeholder-val="{{ false }}">
<button onClick="{{j.watch}}" style="flex:1;{{j.btn2Style}}">Watch</button>
</sc-if>
</div>
</div>
</sc-for>
</div>
</sc-if>

<sc-if value="{{ isPicker }}" hint-placeholder-val="{{ false }}">
<div style="height:100%;box-sizing:border-box;padding:56px 24px 24px;display:flex;flex-direction:column;gap:14px">
<div style="display:flex;justify-content:space-between;align-items:center">
<button class="mnu" onClick="{{toMenuFromPicker}}">Menu</button>
</div>
<h1 style="margin:0;font-size:30px;font-weight:800;letter-spacing:-0.5px">{{josekiTitle}}</h1>
<sc-for list="{{pickerList}}" as="k" hint-placeholder-count="4">
<button onClick="{{k.act}}" style="display:flex;align-items:center;gap:14px;height:76px;padding:0 20px;border:0;border-radius:24px;background:#fff;box-shadow:0 1px 0 #ebe5da;text-align:left;font-size:20px;font-weight:800;color:#2d3042"><div style="width:40px;height:40px;border-radius:20px;background:{{k.tint}};flex:none"></div>{{k.label}}</button>
</sc-for>
</div>
</sc-if>

<sc-if value="{{ isStart }}" hint-placeholder-val="{{ true }}">
<div style="height:100%;box-sizing:border-box;padding:56px 24px 32px;display:flex;flex-direction:column;gap:20px">
<div style="display:flex;align-items:center;gap:10px">
<div style="flex:1"></div>
<button class="mnu" onClick="{{toMenu}}">Menu</button>
</div>
<div>
<h1 style="margin:2px 0 0;font-size:32px;font-weight:800;letter-spacing:-0.5px">{{josekiTitle}}</h1>
</div>
<div style="font-size:17px;line-height:1.45;color:#454a5f">{{josekiWhy}}</div>
<div style="flex:1;min-height:0;display:flex;align-items:center;justify-content:center"><div style="{{thinkSpider}}"></div></div>
<button class="pri" onClick="{{begin}}" style="height:56px">Start</button>
</div>
</sc-if>

<sc-if value="{{ isIntro }}" hint-placeholder-val="{{ false }}">
<div style="height:100%;box-sizing:border-box;padding:24px 25px 28px;display:flex;flex-direction:column;gap:16px">
<div style="display:flex;justify-content:space-between;align-items:center;gap:8px">
<button class="mnu" onClick="{{toMenu}}" aria-label="Back to menu">Menu</button>
</div>
<div style="display:flex;align-items:center">
<sc-for list="{{stages}}" as="s" hint-placeholder-count="4">
<button class="stp" onClick="{{s.act}}" style="{{s.btn}}">{{s.label}}</button>
<sc-if value="{{ s.hasLink }}" hint-placeholder-val="{{ true }}"><div style="{{s.link}}"></div></sc-if>
</sc-for>
</div>
<div style="flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:14px">
<div style="{{heroSpider}}"></div>
<button class="pri ttl" onClick="{{startStage}}">{{introTitle}}</button>
<div style="font-size:17px;line-height:1.5;color:#454a5f;max-width:310px">{{introText}}</div>
</div>
</div>
</sc-if>

<sc-if value="{{ isLesson }}" hint-placeholder-val="{{ false }}">
<div style="height:100%;box-sizing:border-box;padding:24px 25px 20px;display:flex;flex-direction:column;gap:10px">
<div style="display:flex;justify-content:space-between;align-items:center;gap:8px">
<button class="mnu" onClick="{{toMenu}}" aria-label="Back to menu">Menu</button>
<div style="font-size:16px;font-weight:800;flex:1;text-align:center">{{lessonTitle}}</div>
<div style="min-width:64px"></div>
</div>
<div style="display:flex;align-items:center">
<sc-for list="{{stages}}" as="s" hint-placeholder-count="4">
<button class="stp" onClick="{{s.act}}" style="{{s.btn}}">{{s.label}}</button>
<sc-if value="{{ s.hasLink }}" hint-placeholder-val="{{ true }}"><div style="{{s.link}}"></div></sc-if>
</sc-for>
</div>
<div style="height:44px;display:flex;align-items:center"><div style="{{barBox}}"><div style="{{barFill}}"></div><div style="{{markerStyle}}"></div><div style="{{walkerStyle}}"></div></div></div>
<div style="display:flex;gap:10px;align-items:flex-start;height:56px;flex:none"><div style="{{promptStyle}}">{{shownPrompt}}</div></div>
<div style="{{boardStyle}}">
<div style="{{gridStyle}}"></div>
<sc-for list="{{edges}}" as="e" hint-placeholder-count="2">
<div style="{{e.style}}"></div>
</sc-for>
<sc-for list="{{stones}}" as="st" hint-placeholder-count="2">
<div style="{{st.style}}"><div style="{{st.eyes}}"></div><div style="{{st.mouth}}"></div>{{st.label}}<div style="{{st.numStyle}}">{{st.num}}</div></div>
</sc-for>
<sc-for list="{{cells}}" as="cell" hint-placeholder-count="0">
<button aria-label="{{cell.label}}" onClick="{{cell.tap}}" style="{{cell.style}}"></button>
</sc-for>
</div>
<sc-if value="{{ showOptions }}" hint-placeholder-val="{{ false }}">
<div style="display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px">
<sc-for list="{{options}}" as="o" hint-placeholder-count="3">
<button onClick="{{o.pick}}" style="{{o.style}}">{{o.l}}</button>
</sc-for>
</div>
</sc-if>
<sc-if value="{{ showMore }}" hint-placeholder-val="{{ false }}">
<button onClick="{{moreAction}}" style="height:44px;border:0;border-radius:22px;background:#eceef3;color:#3b3f58;font-size:15px;font-weight:800">One more corner</button>
</sc-if>
<sc-if value="{{ showNext }}" hint-placeholder-val="{{ false }}">
<button class="pri" onClick="{{nextAction}}" style="height:52px">{{nextLabel}}</button>
</sc-if>
</div>
</sc-if>

<sc-if value="{{ isResult }}" hint-placeholder-val="{{ false }}">
<div style="height:100%;box-sizing:border-box;padding:56px 24px 32px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:14px">
<div style="{{resultSpider}}"></div>
<h1 style="margin:0;font-size:34px;font-weight:800">{{resultTitle}}</h1>
<div style="width:100%;max-width:300px"><div style="{{barBox}}"><div style="{{barFill}}"></div><div style="{{markerStyle}}"></div><div style="{{walkerStyle}}"></div></div></div>
<div style="font-size:16px;line-height:1.5;color:#555a6e;max-width:300px">{{resultText}}</div>
<button class="pri" onClick="{{resultAction}}" style="margin-top:12px;height:54px;padding:0 36px">{{resultButton}}</button>
</div>
</sc-if>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { wk: 0, screen: 'menu', review: false, watchOnly: false, elim: [], flash: null, tries: 0, rd: null, sadLast: false, dir: 0, dirSet: false, jid: 'j33', learned: {}, stage: 0, intro: true, n: 2, t: 0, round: 0, w: 0, q: 0, answered: null, pts: 0, msg: '', kind: '', wrong: null };
  }
  data() {
    const B = (c, r) => ({ c: c, r: r, w: false }), W = (c, r) => ({ c: c, r: r, w: true });
    return {
      j33: {
        d: 2, title: 'Star point: 3-3 invasion', short: '3-3 invasion', sub: 'Invade, block, crawl, extend', tint: '#ffe3dc',
        seq: [B(4, 4), W(3, 3), B(3, 4), W(4, 3), B(5, 4), W(6, 2)],
        why: 'White takes the corner and lives small. Black gets a strong wall.',
        tc: 'Invade the {c} corner.',
        tryP: { 2: 'Block on the side you want to build.', 4: 'Extend.' },
        tb: { 2: 'White invades at 3-3. Block on the side you want to build.', 4: 'White crawls along the edge. Extend.' },
        tw: { 1: 'Invade at 3-3 in the {c} corner.', 3: 'Crawl along the edge.', 5: 'Slide with a knight\u2019s move.' },
        ex: ['Black plays the star point.', 'White invades at 3-3 and has just enough room to live.', 'Black blocks on the side where they want to build.', 'White crawls along the edge to make room for eyes.', 'Black extends and keeps a strong wall.', 'White slides with a knight\u2019s move to settle the corner.'],
        qs: [
          { shown: 2, opts: [{ c: 5, r: 3 }, { c: 3, r: 4 }, { c: 2, r: 4 }], ok: 1, p: 'White invaded at 3-3. Black\u2019s block?' },
          { shown: 3, opts: [{ c: 5, r: 3 }, { c: 2, r: 5 }, { c: 4, r: 3 }], ok: 2, p: 'Crawl along the edge.' },
          { shown: 4, opts: [{ c: 6, r: 5 }, { c: 5, r: 4 }, { c: 3, r: 6 }], ok: 1, p: 'Black\u2019s extension?' }
        ]
      },
      j44: {
        d: 1, title: 'Star point: low approach', short: 'Low approach', sub: 'Approach, extension, slide', tint: '#e9ebf1',
        seq: [B(4, 4), W(6, 3), B(3, 6), W(4, 2), B(3, 3), W(9, 3)],
        why: 'A classic: White approaches, Black builds a base and extends.',
        tc: 'Approach the {c} corner.',
        tryP: { 2: 'Extend low to the other side.', 4: 'Take the 3-3 point.' },
        tb: { 2: 'White approaches low. Extend low to the other side.', 4: 'White slides to the 2nd line. Take the 3-3 point.' },
        tw: { 1: 'Approach low in the {c} corner.', 3: 'Slide to the 2nd line.', 5: 'Extend along the edge.' },
        ex: ['Black plays the star point.', 'White approaches low, a knight\u2019s move away on the 3rd line.', 'Black extends low to the other side, also a knight\u2019s move.', 'White slides onto the 2nd line.', 'Black takes the 3-3 point.', 'White extends along the top edge.'],
        qs: [
          { shown: 2, opts: [{ c: 5, r: 4 }, { c: 3, r: 6 }, { c: 7, r: 3 }], ok: 1, p: 'Black\u2019s low extension?' },
          { shown: 3, opts: [{ c: 6, r: 5 }, { c: 3, r: 2 }, { c: 4, r: 2 }], ok: 2, p: 'Slide to the 2nd line.' },
          { shown: 4, opts: [{ c: 3, r: 3 }, { c: 5, r: 3 }, { c: 4, r: 6 }], ok: 0, p: 'Black\u2019s 3-3 point?' }
        ]
      },
      j34: {
        d: 0, title: 'Komoku: small knight approach', short: 'Small knight approach', sub: 'Kick, stand, extend', tint: '#dff3e7',
        seq: [B(3, 4), W(5, 3), B(4, 3), W(5, 4), B(3, 6), W(9, 3)],
        why: 'Black kicks, so White settles on top and Black keeps sente.',
        fp: 'Play the komoku in the {c} corner.',
        tc: 'Approach the komoku in the {c} corner.',
        tryP: { 2: 'Kick.', 4: 'Extend.' },
        tb: { 2: 'White approaches with a small knight\u2019s move. Kick.', 4: 'White stands. Extend.' },
        tw: { 1: 'Approach with a small knight\u2019s move in the {c} corner.', 3: 'Stand.', 5: 'Extend three spaces.' },
        ex: ['Black plays the komoku.', 'White approaches with a small knight\u2019s move.', 'Black kicks.', 'White stands.', 'Black extends and keeps sente.', 'White extends three spaces along the edge.'],
        qs: [
          { shown: 2, opts: [{ c: 5, r: 2 }, { c: 4, r: 3 }, { c: 6, r: 4 }], ok: 1, p: 'Black\u2019s kick?' },
          { shown: 3, opts: [{ c: 4, r: 2 }, { c: 3, r: 3 }, { c: 5, r: 4 }], ok: 2, p: 'Stand.' },
          { shown: 4, opts: [{ c: 3, r: 6 }, { c: 6, r: 5 }, { c: 5, r: 5 }], ok: 0, p: 'Black\u2019s extension?' }
        ]
      }
    };
  }
  seq(dir) { const q = this.data()[this.state.jid].seq; return dir ? q.map(m => ({ c: m.r, r: m.c, w: m.w })) : q; }
  mkSched() {
    const out = [];
    let pm = -1, pw = null, run = 0;
    for (let i = 0; i < 16; i++) {
      let m, w;
      do { m = 1 + Math.floor(Math.random() * 3); w = Math.random() < 0.5; } while ((m === pm && w === pw) || (w === pw && run >= 2));
      run = w === pw ? run + 1 : 1; pm = m; pw = w;
      out.push({ mode: m, white: w, both: i > 0 && Math.random() < 0.2 });
    }
    return out;
  }
  dirInit(jid, userWhite) {
    if (userWhite === 'both') return { dir: 0, dirSet: false };
    const J = this.data()[jid], opp = J.seq[J.d].w !== userWhite;
    return { dir: opp && Math.random() < 0.5 ? 1 : 0, dirSet: opp };
  }
  tf(m, mode) {
    if (mode === 1) return { c: 10 - m.c, r: 10 - m.r, w: m.w };
    if (mode === 2) return { c: m.c, r: 10 - m.r, w: m.w };
    if (mode === 3) return { c: 10 - m.c, r: m.r, w: m.w };
    return m;
  }
  web(state) {
    const c = state === 0 ? '#b3b7ca' : '#4b4f6e';
    const f = (v) => Math.round(v * 10) / 10;
    const mk = (seed) => (n) => { const x = Math.sin((n + seed) * 91.7 + 17.3) * 43758.5453; return x - Math.floor(x) - 0.5; };
    const smooth = (pts) => { let d = 'M' + f(pts[0][0]) + ' ' + f(pts[0][1]); for (let i = 1; i < pts.length - 1; i++) { const m = [(pts[i][0] + pts[i + 1][0]) / 2, (pts[i][1] + pts[i + 1][1]) / 2]; d += 'Q' + f(pts[i][0]) + ' ' + f(pts[i][1]) + ' ' + f(m[0]) + ' ' + f(m[1]); } const l = pts[pts.length - 1]; return d + 'L' + f(l[0]) + ' ' + f(l[1]); };
    let inner;
    if (state === 2) {
      const rn = mk(11), n = 7, rings = 2, ang = [], len = [];
      for (let k = 0; k < n; k++) { ang.push((k * 360 / n - 90 + rn(k) * 8) * Math.PI / 180); len.push(12.4 + rn(k + 10) * 2.2); }
      let sp = '';
      for (let k = 0; k < n; k++) { const e = [Math.cos(ang[k]) * len[k], Math.sin(ang[k]) * len[k]]; sp += 'M' + f(rn(k + 20) * 0.5) + ' ' + f(rn(k + 30) * 0.5) + 'Q' + f(e[0] * 0.5 + rn(k + 40) * 1.2) + ' ' + f(e[1] * 0.5 + rn(k + 50) * 1.2) + ' ' + f(e[0]) + ' ' + f(e[1]); }
      let rg = '';
      for (let q = 0; q < rings; q++) {
        const r = (q + 1) / rings * 0.88; let d = '';
        for (let k = 0; k < n; k++) {
          const j = (k + 1) % n;
          const a = [Math.cos(ang[k]) * len[k] * r * (1 + rn(q * 13 + k) * 0.06), Math.sin(ang[k]) * len[k] * r * (1 + rn(q * 13 + k + 60) * 0.06)];
          const b = [Math.cos(ang[j]) * len[j] * r * (1 + rn(q * 13 + j) * 0.06), Math.sin(ang[j]) * len[j] * r * (1 + rn(q * 13 + j + 60) * 0.06)];
          const m = [(a[0] + b[0]) / 2 * 0.88 + rn(q * 7 + k) * 0.5, (a[1] + b[1]) / 2 * 0.88 + rn(q * 7 + k + 20) * 0.5];
          d += (k === 0 ? 'M' + f(a[0]) + ' ' + f(a[1]) : '') + 'Q' + f(m[0]) + ' ' + f(m[1]) + ' ' + f(b[0]) + ' ' + f(b[1]);
        }
        rg += '<path d="' + d + '" stroke-width="' + (0.95 - q * 0.08) + '" opacity="' + (0.9 - q * 0.05) + '"/>';
      }
      inner = '<g fill="none" stroke="' + c + '" stroke-linecap="round" stroke-linejoin="round"><path d="' + sp + '" stroke-width="1.2"/>' + rg + '</g>';
    } else {
