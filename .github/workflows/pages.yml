# Publishes the app to GitHub Pages on every push to main.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Collect the app files
        run: |
          mkdir _site
          cp index.html app.js style.css sw.js manifest.webmanifest icon.svg icon-192.png icon-512.png apple-touch-icon.png _site/
          echo "window.JOSEKI_VERSION = 'v${{ github.run_number }} · $(TZ=Europe/Berlin date '+%d.%m. %H:%M')';" > _site/version.js

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Wait for the artifact to be available
        run: sleep 15
      - id: deployment
        uses: actions/deploy-pages@v4
        continue-on-error: true
      - name: Retry the deployment once
        if: steps.deployment.outcome == 'failure'
        id: retry
        run: sleep 30
      - uses: actions/deploy-pages@v4
        if: steps.deployment.outcome == 'failure'
