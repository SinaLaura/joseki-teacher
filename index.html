<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#f8f4e9">
  <meta name="color-scheme" content="light only">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Joseki Spider Sensei">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <title>Joseki Spider Sensei</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;600;700;800&family=Patrick+Hand&display=swap">
  <link rel="stylesheet" href="style.css">
</head>
<body>
<div id="fit"><div id="app"></div><div id="ver"></div></div>
<template id="tpl">
<div style="width:100%;height:100%;box-sizing:border-box;background:url(data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSIyMDAiIGhlaWdodD0iMjAwIj48ZmlsdGVyIGlkPSJuIj48ZmVUdXJidWxlbmNlIHR5cGU9ImZyYWN0YWxOb2lzZSIgYmFzZUZyZXF1ZW5jeT0iLjkiIG51bU9jdGF2ZXM9IjIiIHNlZWQ9IjQiLz48ZmVDb2xvck1hdHJpeCB2YWx1ZXM9IjAgMCAwIDAgLjQ1ICAwIDAgMCAwIC40ICAwIDAgMCAwIC4zICAwIDAgMCAuMDkgMCIvPjwvZmlsdGVyPjxyZWN0IHdpZHRoPSIyMDAiIGhlaWdodD0iMjAwIiBmaWx0ZXI9InVybCgjbikiLz48L3N2Zz4=) #f8f4e9;overflow:hidden;position:relative">
<div style="{{hangStyle}}"><div style="{{threadStyle}}"></div><div style="{{bugStyle}}"></div></div>

<sc-if value="{{ isMixPage }}" hint-placeholder-val="{{ false }}">
<div style="position:absolute;inset:0;box-sizing:border-box;padding:96px 28px 32px;display:flex;flex-direction:column;gap:6px;overflow:auto">
<h1 style="margin:0;padding-right:70px;font-size:32px;line-height:1.15;color:#2d3042">Train freely with the joseki you know.</h1>
<div style="margin:4px 0 14px;font-size:16px;line-height:1.5;color:#5a5f74">Tick the ones to train.</div>
<sc-for list="{{mixList}}" as="m" hint-placeholder-count="2">
<button class="pk" onClick="{{m.act}}" aria-label="{{m.aria}}" style="{{m.rowStyle}}">
<div style="width:58px;height:58px;flex:none;background:{{m.thumb}} center/58px 58px no-repeat"></div>
<div style="flex:1;min-width:0"><div style="font-family:'Patrick Hand',Nunito,sans-serif;font-size:26px;line-height:1.1;color:#2d3042">{{m.name}}</div><div style="margin-top:4px;font-size:13px;font-weight:600;color:#7a7e90">{{m.sub}}</div></div>
<div style="{{m.markStyle}}"></div>
</button>
<div style="{{ruleStyle}}"></div>
</sc-for>
<sc-if value="{{ mixReady }}" hint-placeholder-val="{{ false }}"><button class="pri" onClick="{{mixStart}}" style="margin-top:18px">Start</button></sc-if>
</div>
<button class="stp" aria-label="Turn back to the menu" onClick="{{mixBack}}" style="{{backTurnerStyle}}"></button>
</sc-if>
<sc-if value="{{ isMenu }}" hint-placeholder-val="{{ false }}">
<div style="{{menuPage}}">
<div style="height:100%;box-sizing:border-box;padding:64px 28px 32px;display:flex;flex-direction:column;gap:6px;overflow:auto">
<h1 style="margin:0 0 18px;padding-right:70px;font-size:32px;line-height:1.15;color:#2d3042">{{tagline}}</h1>
<sc-for list="{{josekiList}}" as="j" hint-placeholder-count="2">
<button class="pk" onClick="{{j.act}}" aria-label="{{j.aria}}" style="{{j.rowStyle}}">
<div style="width:58px;height:58px;flex:none;background:{{j.thumb}} center/58px 58px no-repeat"></div>
<div style="flex:1;min-width:0"><div style="font-family:'Patrick Hand',Nunito,sans-serif;font-size:26px;line-height:1.1;color:#2d3042">{{j.name}}</div><div style="margin-top:4px;font-size:13px;font-weight:600;color:#7a7e90">{{j.sub}}</div></div>
<div style="{{j.todoStyle}}">to do</div>
<div style="{{j.markStyle}}"></div>
</button>
<sc-if value="{{ vA }}" hint-placeholder-val="{{ true }}"><div style="{{ruleStyle}}"></div></sc-if>
</sc-for>
</div>
<button class="stp" aria-label="Turn the page" onClick="{{toMix}}" style="{{turnerStyle}}"></button>
</div>
</sc-if>

<sc-if value="{{ isPicker }}" hint-placeholder-val="{{ false }}">
<div style="height:100%;box-sizing:border-box;padding:56px 28px 32px;display:flex;flex-direction:column;gap:8px">
<div style="display:flex;justify-content:flex-start;align-items:center;height:28px">
<button class="mnu" onClick="{{toMenuFromPicker}}">Menu</button>
</div>
<h1 style="margin:14px 0 20px;font-size:34px;line-height:1.1;color:#2d3042">{{josekiTitle}}</h1>
<sc-for list="{{pickerList}}" as="k" hint-placeholder-count="4">
<button class="{{pkClass}}" onClick="{{k.act}}" style="{{k.rowStyle}}"><span style="{{k.dot}}"></span>{{k.label}}</button>
<sc-if value="{{ vA }}" hint-placeholder-val="{{ true }}"><div style="{{ruleStyle}}"></div></sc-if>
</sc-for>
</div>
</sc-if>

<sc-if value="{{ isStart }}" hint-placeholder-val="{{ true }}">
<div style="height:100%;box-sizing:border-box;padding:56px 28px 40px;display:flex;flex-direction:column;gap:14px">
<div style="display:flex;align-items:center;height:28px"><button class="mnu" onClick="{{toMenu}}">Menu</button></div>
<h1 style="margin:14px 0 0;font-size:38px;line-height:1.08;color:#2d3042">{{josekiTitle}}</h1>
<div style="font-size:16px;line-height:1.5;color:#5a5f74;max-width:320px">{{josekiWhy}}</div>
<div style="flex:1;min-height:0;display:flex;align-items:center;justify-content:center"><div style="{{thinkSpider}}"></div></div>
<button class="pri" onClick="{{begin}}">Start</button>
</div>
</sc-if>

<sc-if value="{{ isIntro }}" hint-placeholder-val="{{ false }}">
<div style="height:100%;box-sizing:border-box;padding:56px 25px 40px;display:flex;flex-direction:column">
<sc-if value="{{ hdCur }}" hint-placeholder-val="{{ true }}">
<div style="display:flex;justify-content:space-between;align-items:center;height:28px;flex:none">
<button class="mnu" onClick="{{toMenu}}" aria-label="Back to menu">Menu</button>
<div style="font-family:'Patrick Hand',Nunito,sans-serif;font-size:22px;flex:1;text-align:center;color:#2d3042">{{lessonTitle}}</div>
<div style="min-width:48px"></div>
</div>
</sc-if>
<sc-if value="{{ hdX }}" hint-placeholder-val="{{ false }}">
<div style="display:flex;flex-direction:column;align-items:flex-start;gap:8px;flex:none">
<button class="mnu" onClick="{{toMenu}}" aria-label="Back to menu">Menu</button>
<div style="font-family:'Patrick Hand',Nunito,sans-serif;font-size:31px;line-height:1.1;color:#2d3042">{{headTitle}}</div>
</div>
</sc-if>
<sc-if value="{{ hdY }}" hint-placeholder-val="{{ false }}">
<div style="display:flex;align-items:center;gap:12px;height:48px;flex:none">
<div style="{{headThumb}}"></div>
<div style="flex:1;min-width:0;font-family:'Patrick Hand',Nunito,sans-serif;font-size:25px;line-height:1.1;color:#2d3042">{{headTitle}}</div>
<button class="mnu" onClick="{{toMenu}}" aria-label="Back to menu">Menu</button>
</div>
</sc-if>
<sc-if value="{{ isThread }}" hint-placeholder-val="{{ false }}">
<div style="{{threadBox}}">
<div style="{{threadInk}}"></div>
<sc-for list="{{threadKnots}}" as="tk" hint-placeholder-count="3"><div style="{{tk.style}}"></div></sc-for>
<sc-for list="{{threadTangles}}" as="tg" hint-placeholder-count="3"><div style="{{tg.style}}"></div></sc-for>
<sc-for list="{{threadLabels}}" as="tl" hint-placeholder-count="4"><button class="stp" onClick="{{tl.act}}" style="{{tl.style}}">{{tl.t}}</button></sc-for>
<div style="{{threadWalker}}"></div>
</div>
</sc-if>
<div style="{{stageRowStyle}}">
<sc-for list="{{stages}}" as="s" hint-placeholder-count="4">
<button class="stp" onClick="{{s.act}}" style="{{s.btn}}">{{s.label}}</button>
<sc-if value="{{ s.hasLink }}" hint-placeholder-val="{{ false }}"><div style="{{s.link}}"></div></sc-if>
</sc-for>
</div>
<div style="position:relative;flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:14px;padding-bottom:40px">
<div style="{{heroSpider}}"></div>
<sc-if value="{{ introCalm }}" hint-placeholder-val="{{ false }}"><div style="font-family:'Patrick Hand',Nunito,sans-serif;font-size:46px;line-height:1;color:#2d3042">{{introTitle}}</div></sc-if>
<sc-if value="{{ introBtn }}" hint-placeholder-val="{{ true }}"><button class="pri ttl" onClick="{{startStage}}">{{introTitle}}</button></sc-if>
<div style="font-size:16px;line-height:1.5;color:#5a5f74;max-width:290px">{{introText}}</div>
<button class="stp" aria-label="Start {{introTitle}}" onClick="{{startStage}}" style="position:absolute;inset:0;border:0;background:transparent;padding:0;z-index:5"></button>
</div>
</div>
</sc-if>

<sc-if value="{{ isLesson }}" hint-placeholder-val="{{ false }}">
<div style="height:100%;box-sizing:border-box;padding:56px 25px 28px;display:flex;flex-direction:column">
<sc-if value="{{ hdCur }}" hint-placeholder-val="{{ true }}">
<div style="display:flex;justify-content:space-between;align-items:center;height:28px;flex:none">
<button class="mnu" onClick="{{toMenu}}" aria-label="Back to menu">Menu</button>
<div style="font-family:'Patrick Hand',Nunito,sans-serif;font-size:22px;flex:1;text-align:center;color:#2d3042">{{lessonTitle}}</div>
<div style="min-width:48px"></div>
</div>
</sc-if>
<sc-if value="{{ hdX }}" hint-placeholder-val="{{ false }}">
<div style="display:flex;flex-direction:column;align-items:flex-start;gap:8px;flex:none">
<button class="mnu" onClick="{{toMenu}}" aria-label="Back to menu">Menu</button>
<div style="font-family:'Patrick Hand',Nunito,sans-serif;font-size:31px;line-height:1.1;color:#2d3042">{{headTitle}}</div>
</div>
</sc-if>
<sc-if value="{{ hdY }}" hint-placeholder-val="{{ false }}">
<div style="display:flex;align-items:center;gap:12px;height:48px;flex:none">
<div style="{{headThumb}}"></div>
<div style="flex:1;min-width:0;font-family:'Patrick Hand',Nunito,sans-serif;font-size:25px;line-height:1.1;color:#2d3042">{{headTitle}}</div>
<button class="mnu" onClick="{{toMenu}}" aria-label="Back to menu">Menu</button>
</div>
</sc-if>
<sc-if value="{{ isThread }}" hint-placeholder-val="{{ false }}">
<div style="{{threadBox}}">
<div style="{{threadInk}}"></div>
<sc-for list="{{threadKnots}}" as="tk" hint-placeholder-count="3"><div style="{{tk.style}}"></div></sc-for>
<sc-for list="{{threadTangles}}" as="tg" hint-placeholder-count="3"><div style="{{tg.style}}"></div></sc-for>
<sc-for list="{{threadLabels}}" as="tl" hint-placeholder-count="4"><button class="stp" onClick="{{tl.act}}" style="{{tl.style}}">{{tl.t}}</button></sc-for>
<div style="{{threadWalker}}"></div>
</div>
</sc-if>
<div style="{{stageRowStyle}}">
<sc-for list="{{stages}}" as="s" hint-placeholder-count="4">
<button class="stp" onClick="{{s.act}}" style="{{s.btn}}">{{s.label}}</button>
<sc-if value="{{ s.hasLink }}" hint-placeholder-val="{{ false }}"><div style="{{s.link}}"></div></sc-if>
</sc-for>
</div>
<div style="{{barWrap}}"><div style="{{barBox}}"><div style="{{barFill}}"></div><div style="{{markerStyle}}"></div><div style="{{walkerStyle}}"></div></div></div>
<div style="{{lessonBody}}">
<sc-if value="{{ preview }}" hint-placeholder-val="{{ false }}">
<div style="display:flex;align-items:flex-end;height:76px;flex:none;margin-bottom:24px"><div style="font-family:'Patrick Hand',Nunito,sans-serif;font-size:28px;line-height:1.1;color:#2d3042;white-space:nowrap"><span style="font-size:44px;line-height:1">{{introWord}}</span> {{introRest}}</div></div>
</sc-if>
<sc-if value="{{ noPreview }}" hint-placeholder-val="{{ true }}">
<div style="{{promptBox}}"><div style="{{promptStyle}}">{{shownPrompt}}</div></div>
</sc-if>
<div style="{{boardWrap}}">
<div style="{{boardStyle}}">
<div style="{{gridStyle}}"></div>
<sc-for list="{{edges}}" as="e" hint-placeholder-count="2">
<div style="{{e.style}}"></div>
</sc-for>
<sc-for list="{{stones}}" as="st" hint-placeholder-count="2">
<div style="{{st.style}}"><div style="{{st.eyes}}"></div><div style="{{st.mouth}}"></div>{{st.label}}<div style="{{st.numStyle}}">{{st.num}}</div></div>
</sc-for>
<sc-for list="{{cells}}" as="cell" hint-placeholder-count="0">
<button aria-label="{{cell.label}}" onClick="{{cell.tap}}" style="{{cell.style}}"></button>
</sc-for>
</div>
</div>
<sc-if value="{{ showQuiz }}" hint-placeholder-val="{{ false }}">
<div style="{{quizWrap}}">
<sc-for list="{{quizItems}}" as="qz" hint-placeholder-count="4">
<button class="stp" aria-label="{{qz.name}}" onClick="{{qz.act}}" style="{{qz.style}}"><div style="{{qz.pic}}"></div><div style="{{qz.nameStyle}}">{{qz.name}}</div><div style="{{qz.mark}}"></div></button>
</sc-for>
</div>
</sc-if>
<sc-if value="{{ preview }}" hint-placeholder-val="{{ false }}"><button class="stp" aria-label="Start {{introTitle}}" onClick="{{startStage}}" style="position:absolute;inset:0;border:0;background:transparent;padding:0;z-index:5"></button></sc-if>
<sc-if value="{{ showOptions }}" hint-placeholder-val="{{ false }}">
<div style="display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;flex:none">
<sc-for list="{{options}}" as="o" hint-placeholder-count="3">
<button onClick="{{o.pick}}" style="{{o.style}}">{{o.l}}</button>
</sc-for>
</div>
</sc-if>
<div style="height:84px;flex:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px">
<sc-if value="{{ showNext }}" hint-placeholder-val="{{ false }}">
<button class="pri" onClick="{{nextAction}}">{{nextLabel}}</button>
</sc-if>
<sc-if value="{{ showMore }}" hint-placeholder-val="{{ false }}">
<button class="mnu" onClick="{{moreAction}}">One more corner</button>
</sc-if>
</div>
</div>
</div>
</sc-if>

<sc-if value="{{ isResult }}" hint-placeholder-val="{{ false }}">
<div style="{{resultWrap}}">
<div style="{{rappelBox}}"><div style="{{rappelThread}}"></div><div style="{{rappelSpider}}"></div></div>
<div style="{{resultSpider}}"></div>
<sc-if value="{{ isThread }}" hint-placeholder-val="{{ false }}"><div style="height:420px;flex:none"></div></sc-if>
<h1 style="margin:0;font-size:44px;line-height:1.1;color:#2d3042">{{resultTitle}}</h1>
<sc-if value="{{ isThread }}" hint-placeholder-val="{{ false }}"><div style="display:flex;gap:18px"><sc-for list="{{resultWebs}}" as="rw" hint-placeholder-count="3"><div style="{{rw.style}}"></div></sc-for></div></sc-if>
<div style="width:100%;max-width:300px"><div style="{{barBox}}"><div style="{{barFill}}"></div><div style="{{markerStyle}}"></div><div style="{{walkerStyle}}"></div></div></div>
<div style="{{resultTextStyle}}">{{resultText}}</div>
<button class="pri" onClick="{{resultAction}}" style="margin-top:20px">{{resultButton}}</button>
</div>
</sc-if>

<sc-if value="{{ isDemo }}" hint-placeholder-val="{{ false }}">
<button class="stp" onClick="{{demoNext}}" style="position:absolute;right:12px;bottom:12px;z-index:60;border:1.5px dashed #9a9eb8;border-radius:16px;padding:6px 12px;background:rgba(255,253,247,.85);font:700 13px Nunito,sans-serif;color:#6b6f8c">Next step ›</button>
</sc-if>

</div>
</template>
<script src="version.js"></script>
<script src="app.js"></script>
</body>
</html>
